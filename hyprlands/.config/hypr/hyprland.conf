windowrule = float on, match:title ^(blueberry.py)$
windowrule = float on, match:title ^(org.gnome.Settings)$
windowrule = float on, match:title ^(org.gnome.Calendar)$
windowrule = rounding 0, match:class ^org.gnome.Calendar$
windowrule = no_shadow on, match:class ^org.gnome.Calendar$
windowrule = no_anim on, match:class ^org.gnome.Calendar$
windowrule = float on, match:title ^(org.gnome.design.Palette)$
windowrule = float on, match:title ^(Color Picker)$
windowrule = float on, match:title ^(Network)$
windowrule = float on, match:class ^(xdg-desktop-portal)$
windowrule = float on, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on, match:class ^(xdg-desktop-portal-gnome)$
windowrule = float on, match:title ^(transmission-gtk)$
windowrule = float on, match:class quickshell

# Modal windows — auto float (confirmation dialogs, etc.)
windowrule = float on, match:modal 1

# Dialogs
windowrule = float on, match:class ^(thunar)$, match:title ^Rename\s
windowrule = float on, match:title (Select|Open)( a)? (File|Folder)(s)?
windowrule = float on, match:title File (Operation|Upload)( Progress)?
windowrule = float on, match:title .* Properties
windowrule = float on, match:title Export Image as PNG
windowrule = float on, match:title GIMP Crash Debug
windowrule = float on, match:title Save As
windowrule = float on, match:title Library

# Ugh xwayland popups
windowrule = no_dim on, match:xwayland 1, match:title win[0-9]+
windowrule = no_shadow on, match:xwayland 1, match:title win[0-9]+
windowrule = rounding 10, match:xwayland 1, match:title win[0-9]+

# Fuzzel
layerrule = animation popin 80%, match:namespace launcher
layerrule = blur on, match:namespace launcher

# Shell
layerrule = no_anim on, match:namespace caelestia-(launcher|osd|notifications|border-exclusion|area-picker)
layerrule = animation fade, match:namespace caelestia-(drawers|background)
layerrule = order 1, match:namespace caelestia-border-exclusion
layerrule = order 2, match:namespace caelestia-bar


# Picture in picture (resize and move done via script)
windowrule = move 100%-w-2% 100%-w-3%, match:title Picture(-| )in(-| )[Pp]icture  # Initial move so window doesn't shoot across the screen from the center
windowrule = keep_aspect_ratio on, match:title Picture(-| )in(-| )[Pp]icture
windowrule = float on, match:title Picture(-| )in(-| )[Pp]icture
windowrule = pin on, match:title Picture(-| )in(-| )[Pp]icture


