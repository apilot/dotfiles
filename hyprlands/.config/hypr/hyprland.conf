

# status bar

exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# Use gtk-settings
exec-once = apply-gsettings

exec = dbus-daemon --session --address=unix:path=$XDG_RUNTIME_DIR/bus

env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_SIZE,25
env = LIBVA_DRIVER_NAME,iHD
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct
# AQ_DRM_DEVICES: restrict to real GPUs only (Intel iGPU + NVIDIA dGPU).
# EVDI (card2+) has no GPU renderer, causes "Failed to initialize renderer state".
# Hyprland will still detect EVDI connectors but use mgpu copy for rendering.
env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card1:/dev/dri/card2
# Force Intel i915 render node for EVDI (DisplayLink) — it has no own render node
#env = AQ_RENDER_NODE,/dev/dri/renderD128

exec = nm-applet --indicator &

exec-once = waybar &
# Add networkmanager applet to tray in waybar
exec-once = blueman-tray

# Add KMix applet to tray in waybar
exec-once = kmix 
exec-once = ~/.config/hypr/scripts/displaylink-hotplug.sh 

# See https://wiki.hyprland.org/Configuring/Monitors/

# DisplayLink — $DL is set via sourced file, updated by displaylink-hotplug.sh
source = ~/.config/hypr/conf/displaylink.conf
monitor=$DL, 1920x1080@60, 0x0, 1.00

monitor=eDP-1, 1920x1080@240.00101, 960x1080, 1.0
monitor=HDMI-A-1, 1920x1080@75, 1920x0, 1.00


# workspaces to monitor assign
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:$DL
workspace = 5, monitor:$DL
workspace = 6, monitor:$DL
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1


# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Execute your favorite apps at launch

exec = ~/.local/share/qmk-hid-host/qmk-hid-host


