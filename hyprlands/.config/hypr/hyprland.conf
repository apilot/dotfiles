# ═════════════════════════════════════════════════════════════════════
# hy3 plugin — i3/sway-like tiling layout
# ═════════════════════════════════════════════════════════════════════
plugin = /usr/lib64/libhy3.so
# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    numlock_by_default= true
    follow_mouse = 1
    force_no_accel = 0

touchpad {
    natural_scroll = true
    tap-to-click = true
    disable_while_typing = true
    clickfinger_behavior = true
    drag_lock = true
}
tablet {
  relative_input = true
  output = $DL
}

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}
device{
  name  = ergohaven-k:03-pro-v1-65mm-mouse
  sensitivity = 0.7
  }
device {
  name = weylus-stylus---bigme
  sensitivity = -1
}
device {
  name = pen-emu
  sensitivity = -1
}
general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 2
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(8f00ffee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true

    layout = hy3
}
cursor {
    enable_hyprcursor = true
    hide_on_key_press = false
    hide_on_touch = false
    no_hardware_cursors = false
    sync_gsettings_theme = true
  }
decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 8
    active_opacity = 0.9
    inactive_opacity = 0.8
    fullscreen_opacity = 1
    dim_inactive = true
    dim_strength = 0.4
    blur {
       enabled = true
       size = 5
       passes = 1
    }

    shadow { 
      enabled = true
      range = 4
      render_power = 3
      color = rgba(1a1a1aee)
    }
}

animations {
    enabled = true

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

plugin {
  hy3 {
    # remove groups when there are no more windows in them
    node_collapse_policy = 0

    autotile {
        enable = true
    }

    tabs {
       height = 3
       padding = 2
       from_top = true
       render_text = false
    }
  }
}


# performance tweaks
misc {
	disable_hyprland_logo = true
	vfr = true
}
# See https://wiki.hyprland.org/Configuring/Keywords/


debug {
disable_logs = false 
}
