# Standard navigation mode bindings
# h/j/k/l = ←↓↑→ (vim-style)
# X keycodes: layout-independent (us/ru).
bind = SUPER, 43, movefocus, l
bind = SUPER, 44, movefocus, d
bind = SUPER, 45, movefocus, u
bind = SUPER, 46, movefocus, r
bind = SUPER SHIFT, 43, movewindow, l
bind = SUPER SHIFT, 44, movewindow, d
bind = SUPER SHIFT, 45, movewindow, u
bind = SUPER SHIFT, 46, movewindow, r
# semicolon is free in standard mode