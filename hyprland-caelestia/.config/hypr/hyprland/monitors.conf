# DisplayLink — $DL is set via sourced file, updated by displaylink-hotplug.sh
source = ~/.config/hypr/conf/displaylink.conf
monitor=$DL, 1920x1080@60, 0x0, 1.00

monitor=eDP-1, 1920x1080@240.00101, 960x1080, 1.0
monitor=HDMI-A-1, 1920x1080@75, 1920x0, 1.00

# workspaces to monitor assign
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:$DL
workspace = 5, monitor:$DL
workspace = 6, monitor:$DL
workspace = 7, monitor:HDMI-A-1
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
