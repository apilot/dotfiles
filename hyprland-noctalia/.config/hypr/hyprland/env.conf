env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_SIZE,25
env = LIBVA_DRIVER_NAME,iHD
# Сессия рендерит на Intel (card0) + 1050 Ti (card2). 3060 (card1) исключена —
# освобождена для vfio-pci passthrough. EVDI/DisplayLink удалены 2026-08-31,
# поэтому статичный список больше не ломает внешние мониторы.
env = AQ_DRM_DEVICES,/dev/dri/card0:/dev/dri/card2
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_DPI_SCALE,1.0
env = MOZ_ENABLE_WAYLAND,1
# GTK_THEME убран: ломает libadwaita-приложения (Calendar и др.).
# Тема GTK3/GTK4 берётся из gsettings (gtk-theme-name) — Catppuccin уже выставлен.
env = XDG_MENU_PREFIX,gentoo-
env = DBUS_SESSION_BUS_ADDRESS,unix:path=/run/user/1000/bus
