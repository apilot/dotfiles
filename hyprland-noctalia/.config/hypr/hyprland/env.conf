env = XCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_THEME,catppuccin-mocha-dark-cursors
env = HYPRCURSOR_SIZE,25
env = LIBVA_DRIVER_NAME,nvidia
# AQ_DRM_DEVICES (primary = 1050 Ti 03:00.0, secondary = Intel 00:02.0) задаётся
# в /etc/environment: в 0.56 env= из конфига не долетает до инициализации бэкенда.
# 3060 (01:00.0) в vfio-pci — ноды нет и не нужна.
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = GDK_DPI_SCALE,1.0
env = MOZ_ENABLE_WAYLAND,1
# GTK_THEME убран: ломает libadwaita-приложения (Calendar и др.).
# Тема GTK3/GTK4 берётся из gsettings (gtk-theme-name) — Catppuccin уже выставлен.
env = XDG_MENU_PREFIX,gentoo-
# Flatpak: экспорт .desktop/иконок для лаунчеров (noctalia) и GTK-приложений.
# user-install: ~/.local/share/flatpak/exports; системные: /var/lib/flatpak/exports.
env = XDG_DATA_DIRS,/home/aboyarinov/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share:/usr/share/gdm
env = DBUS_SESSION_BUS_ADDRESS,unix:path=/run/user/1000/bus
