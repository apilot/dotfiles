# Noctalia shell shortcuts
bind = $mainMod, D, exec, /usr/bin/qs -c noctalia-shell ipc call launcher toggle
bind = $mainMod CTRL, D, exec, /usr/bin/qs -c noctalia-shell ipc call settings toggle
bind = $mainMod SHIFT, E, exec, /usr/bin/qs -c noctalia-shell ipc call sessionMenu toggle
bind = $mainMod, N, exec, /usr/bin/qs -c noctalia-shell ipc call controlCenter toggle
bind = $mainMod ALT, L, exec, /usr/bin/qs -c noctalia-shell ipc call lockScreen lock
bind = $mainMod SHIFT, C, exec, /usr/bin/qs -c noctalia-shell ipc call notifications clear
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -

# Clipboard manager
bind = $mainMod, V, exec, /usr/bin/qs -c noctalia-shell ipc call launcher clipboard

# Window switcher (Alt+Tab)
bind = ALT, Tab, exec, /usr/bin/qs -c noctalia-shell ipc call launcher windows

# App launches
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, T, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, 65, togglefloating,
bind = $mainMod, E, exec, $fileExplorer
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/monitors-detect.sh

# Function key apps
bind = $mainMod, F1, exec, $browser
bind = $mainMod, F2, exec, thunderbird
bind = $mainMod, F4, exec, $editor
# bind = $mainMod, F5, exec, github-desktop          # NOT INSTALLED — GitHub GUI client
bind = $mainMod, F6, exec, gparted
# bind = $mainMod, F7, exec, inkscape                 # NOT INSTALLED — Vector graphics editor
# bind = $mainMod, F8, exec, blender                  # NOT INSTALLED — 3D modeling & rendering
bind = $mainMod, F9, exec, meld
# bind = $mainMod, F10, exec, joplin-desktop           # NOT INSTALLED — Note-taking app (Joplin)
# bind = $mainMod, F11, exec, snapper-tools            # NOT INSTALLED — Btrfs snapshot GUI manager
bind = $mainMod, F12, exec, galculator

# Blue light filter
bind = $mainMod, B, exec, hyprshade on sephia
bind = $mainMod CTRL, B, exec, hyprshade off

# Brightness
bind = ,232, exec, brightnessctl -c backlight set 5%-
bind = ,233, exec, brightnessctl -c backlight set +5%

# Toggle external monitors
bind = $mainMod SHIFT, M, exec, ~/.config/hypr/scripts/toggle_ext_monitors.sh

# Launch workspace apps
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/start-workspace-apps.sh

# Lock script
bind = $mainMod SHIFT, L, exec, ~/.config/hypr/scripts/lock-with-monitors.sh

# hy3 KEYBINDINGS
bindn = , mouse:272, hy3:focustab, mouse
bind = $mainMod, S, hy3:makegroup, opposite, force_ephemeral
bind = $mainMod, W, hy3:changegroup, opposite
bind = $mainMod, X, hy3:changegroup, toggletab

# Move focus
bind = $mainMod, left,  hy3:movefocus, l
bind = $mainMod, right, hy3:movefocus, r
bind = $mainMod, up,    hy3:movefocus, u
bind = $mainMod, down,  hy3:movefocus, d
bind = $mainMod CTRL, left,  hy3:movefocus, l
bind = $mainMod CTRL, right, hy3:movefocus, r
bind = $mainMod CTRL, up,    hy3:movefocus, u
bind = $mainMod CTRL, down,  hy3:movefocus, d
bind = $mainMod CTRL, h,     hy3:movefocus, l
bind = $mainMod CTRL, l,     hy3:movefocus, r
bind = $mainMod CTRL, k,     hy3:movefocus, u
bind = $mainMod CTRL, j,     hy3:movefocus, d

# Move windows
bind = $mainMod SHIFT, up,    hy3:movewindow, u
bind = $mainMod SHIFT, down,  hy3:movewindow, d
bind = $mainMod SHIFT, left,  hy3:movewindow, l
bind = $mainMod SHIFT, right, hy3:movewindow, r

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace
bind = ALT SHIFT, 1, movetoworkspace, 1
bind = ALT SHIFT, 2, movetoworkspace, 2
bind = ALT SHIFT, 3, movetoworkspace, 3
bind = ALT SHIFT, 4, movetoworkspace, 4
bind = ALT SHIFT, 5, movetoworkspace, 5
bind = ALT SHIFT, 6, movetoworkspace, 6
bind = ALT SHIFT, 7, movetoworkspace, 7
bind = ALT SHIFT, 8, movetoworkspace, 8
bind = ALT SHIFT, 9, movetoworkspace, 9
bind = ALT SHIFT, 0, movetoworkspace, 10

# Move active window silently
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Navigation mode
exec-once = ~/.config/hypr/scripts/set_nav_mode.sh standard
bind = $mainMod CTRL SHIFT, 0, exec, ~/.config/hypr/scripts/set_nav_mode.sh toggle
bind = $mainMod CTRL SHIFT, 9, exec, ~/.config/hypr/scripts/set_nav_mode.sh standard
bind = $mainMod CTRL, 0, exec, ~/.config/hypr/scripts/set_nav_mode.sh status

# Screenshots (fallback)
bind = CTRL, Print, exec, .config/hypr/scripts/screenshot_window.sh
bind = SHIFT, Print, exec, .config/hypr/scripts/screenshot_display.sh

# Volume
bind = ,122, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = ,123, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = ,121, exec, pactl set-sink-volume @DEFAULT_SINK@ 0%

# Media
bind = ,172, exec, playerctl play-pause
bind = ,171, exec, playerctl next
bind = ,173, exec, playerctl previous

# Resize submap
bind = $mainMod, R, submap, resize
submap = resize
binde=,right,resizeactive,50 0
binde=,L,resizeactive,50 0
binde=,left,resizeactive,-50 0
binde=,H,resizeactive,-50 0
binde=,up,resizeactive,0 -50
binde=,K,resizeactive,0 -50
binde=,down,resizeactive,0 50
binde=,J,resizeactive,0 50
bind=,escape,submap,reset
submap = reset
