# Noctalia shell shortcuts
bind = $mainMod, 40, exec, /usr/bin/qs -c noctalia-shell ipc call launcher toggle
bind = $mainMod CTRL, 40, exec, /usr/bin/qs -c noctalia-shell ipc call settings toggle
bind = $mainMod SHIFT, 26, exec, /usr/bin/qs -c noctalia-shell ipc call sessionMenu toggle
bind = $mainMod, 57, exec, /usr/bin/qs -c noctalia-shell ipc call controlCenter toggle
bind = $mainMod ALT, 46, exec, /usr/bin/qs -c noctalia-shell ipc call lockScreen lock
bind = $mainMod SHIFT, 54, exec, /usr/bin/qs -c noctalia-shell ipc call notifications clear
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -

# Clipboard manager
bind = $mainMod, 55, exec, /usr/bin/qs -c noctalia-shell ipc call launcher clipboard

# Window switcher (Alt+Tab)
bind = ALT, Tab, exec, /usr/bin/qs -c noctalia-shell ipc call launcher windows

# App launches
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, 28, exec, $terminal
bind = $mainMod, 24, killactive,
bind = $mainMod, 41, fullscreen
bind = $mainMod SHIFT, 65, togglefloating,
bind = $mainMod, 26, exec, $fileExplorer
bind = $mainMod SHIFT, 27, exec, ~/.config/hypr/scripts/monitors-detect.sh

# Function key apps
bind = $mainMod, F1, exec, $browser
bind = $mainMod, F2, exec, thunderbird
bind = $mainMod, F4, exec, $editor
# bind = $mainMod, F5, exec, github-desktop          # NOT INSTALLED — GitHub GUI client
bind = $mainMod, F6, exec, gparted
# bind = $mainMod, F7, exec, inkscape                 # NOT INSTALLED — Vector graphics editor
# bind = $mainMod, F8, exec, blender                  # NOT INSTALLED — 3D modeling & rendering
bind = $mainMod, F9, exec, meld
# bind = $mainMod, F10, exec, joplin-desktop           # NOT INSTALLED — Note-taking app (Joplin)
# bind = $mainMod, F11, exec, snapper-tools            # NOT INSTALLED — Btrfs snapshot GUI manager
bind = $mainMod, F12, exec, galculator

# Blue light filter
bind = $mainMod, 56, exec, hyprshade on sephia
bind = $mainMod CTRL, 56, exec, hyprshade off

# Brightness
bind = ,232, exec, brightnessctl -c backlight set 5%-
bind = ,233, exec, brightnessctl -c backlight set +5%

# Toggle external monitors
bind = $mainMod SHIFT, 58, exec, ~/.config/hypr/scripts/toggle_ext_monitors.sh

# Launch workspace apps
bind = $mainMod SHIFT, 39, exec, ~/.config/hypr/scripts/start-workspace-apps.sh

# Lock script
bind = $mainMod SHIFT, 46, exec, ~/.config/hypr/scripts/lock-with-monitors.sh

# hy3 KEYBINDINGS
bindn = , mouse:272, hy3:focustab, mouse
bind = $mainMod, 39, hy3:makegroup, opposite, force_ephemeral
bind = $mainMod, 25, hy3:changegroup, opposite
bind = $mainMod, 53, hy3:changegroup, toggletab

# Move focus
bind = $mainMod, left,  hy3:movefocus, l
bind = $mainMod, right, hy3:movefocus, r
bind = $mainMod, up,    hy3:movefocus, u
bind = $mainMod, down,  hy3:movefocus, d
bind = $mainMod CTRL, left,  hy3:movefocus, l
bind = $mainMod CTRL, right, hy3:movefocus, r
bind = $mainMod CTRL, up,    hy3:movefocus, u
bind = $mainMod CTRL, down,  hy3:movefocus, d
bind = $mainMod CTRL, 43,    hy3:movefocus, l
bind = $mainMod CTRL, 46,    hy3:movefocus, r
bind = $mainMod CTRL, 45,    hy3:movefocus, u
bind = $mainMod CTRL, 44,    hy3:movefocus, d

# Move windows
bind = $mainMod SHIFT, up,    hy3:movewindow, u
bind = $mainMod SHIFT, down,  hy3:movewindow, d
bind = $mainMod SHIFT, left,  hy3:movewindow, l
bind = $mainMod SHIFT, right, hy3:movewindow, r

# Workspaces
bind = $mainMod, 10, workspace, 1
bind = $mainMod, 11, workspace, 2
bind = $mainMod, 12, workspace, 3
bind = $mainMod, 13, workspace, 4
bind = $mainMod, 14, workspace, 5
bind = $mainMod, 15, workspace, 6
bind = $mainMod, 16, workspace, 7
bind = $mainMod, 17, workspace, 8
bind = $mainMod, 18, workspace, 9
bind = $mainMod, 19, workspace, 10

# Move to workspace
bind = ALT SHIFT, 10, movetoworkspace, 1
bind = ALT SHIFT, 11, movetoworkspace, 2
bind = ALT SHIFT, 12, movetoworkspace, 3
bind = ALT SHIFT, 13, movetoworkspace, 4
bind = ALT SHIFT, 14, movetoworkspace, 5
bind = ALT SHIFT, 15, movetoworkspace, 6
bind = ALT SHIFT, 16, movetoworkspace, 7
bind = ALT SHIFT, 17, movetoworkspace, 8
bind = ALT SHIFT, 18, movetoworkspace, 9
bind = ALT SHIFT, 19, movetoworkspace, 10

# Move active window silently
bind = $mainMod SHIFT, 10, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 11, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 12, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 13, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 14, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 15, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 16, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 17, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 18, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 19, movetoworkspacesilent, 10

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Navigation mode
exec-once = ~/.config/hypr/scripts/set_nav_mode.sh standard
bind = $mainMod CTRL SHIFT, 19, exec, ~/.config/hypr/scripts/set_nav_mode.sh toggle
bind = $mainMod CTRL SHIFT, 18, exec, ~/.config/hypr/scripts/set_nav_mode.sh standard
bind = $mainMod CTRL, 19, exec, ~/.config/hypr/scripts/set_nav_mode.sh status

# Screenshots (fallback)
bind = CTRL, Print, exec, .config/hypr/scripts/screenshot_window.sh
bind = SHIFT, Print, exec, .config/hypr/scripts/screenshot_display.sh

# Volume
bind = ,122, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = ,123, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = ,121, exec, pactl set-sink-volume @DEFAULT_SINK@ 0%

# Media
bind = ,172, exec, playerctl play-pause
bind = ,171, exec, playerctl next
bind = ,173, exec, playerctl previous

# Resize submap
bind = $mainMod, 27, submap, resize
submap = resize
binde=,right,resizeactive,50 0
binde=,46,resizeactive,50 0
binde=,left,resizeactive,-50 0
binde=,43,resizeactive,-50 0
binde=,up,resizeactive,0 -50
binde=,45,resizeactive,0 -50
binde=,down,resizeactive,0 50
binde=,44,resizeactive,0 50
bind=,escape,submap,reset
submap = reset
