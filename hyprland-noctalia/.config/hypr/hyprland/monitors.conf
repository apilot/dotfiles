# Monitors — connector names are auto-detected by monitors-detect.sh and stored
# in the sourced file below. Physical layout: [DP] left · [HDMI] right · laptop (eDP) below center.
source = ~/.config/hypr/conf/monitors-detected.conf

monitor=$DP,   1920x1080@$DP_RATE,  0x0,      1.00   # left external  (DP≈75 / legacy DVI=60)
monitor=eDP-1, 1920x1080@240.00101, 960x1080, 1.0    # laptop         (below center)
monitor=$HDMI, 1920x1080@75,        1920x0,   1.00   # right external (GPU HDMI)

# workspaces to monitor assign
workspace = 1, monitor:eDP-1
workspace = 2, monitor:eDP-1
workspace = 3, monitor:eDP-1
workspace = 4, monitor:$DP
workspace = 5, monitor:$DP
workspace = 6, monitor:$DP
workspace = 7, monitor:$HDMI
workspace = 8, monitor:$HDMI
workspace = 9, monitor:$HDMI
